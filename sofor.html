<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0e1b2c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Şoför Paneli">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="NoktaTedarik-Logo.jpg">
<title>NOKTA TEDARİK — Şoför Paneli</title>
<style>
  :root { --turuncu:#f77f00; --turuncu-koyu:#d96b00; --mavi:#0e1b2c; --yesil:#1faa4c; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Segoe UI',Tahoma,Arial,sans-serif; background:#f4f7fb; color:#33465c; }
  .ust { background:linear-gradient(135deg,#0e1b2c,#1b2f4a); color:#fff; padding:18px 16px; text-align:center; position:sticky; top:0; z-index:5; box-shadow:0 4px 18px rgba(14,27,44,.25); }
  .ust h1 { font-size:1.05rem; letter-spacing:2px; }
  .ust .alt { font-size:.78rem; opacity:.85; margin-top:4px; }
  .ust .sehir { color:#ffb347; font-weight:800; font-size:1.05rem; }
  .ozet { display:flex; justify-content:space-between; align-items:center; padding:12px 16px; background:#fff; border-bottom:1px solid #e3eaf2; position:sticky; top:78px; z-index:4; }
  .ozet b { color:var(--turuncu-koyu); font-size:1.25rem; }
  .ozet span { font-size:.78rem; color:#6b7f94; }
  .liste { padding:12px; display:grid; gap:10px; }
  .il-baslik { background:linear-gradient(135deg,#0e1b2c,#1b2f4a); color:#fff; border-radius:12px; padding:10px 14px; font-weight:800; font-size:.88rem; letter-spacing:1px; display:flex; justify-content:space-between; align-items:center; }
  .il-baslik span { color:#ffb347; font-size:.75rem; font-weight:700; }
  .magaza { background:#fff; border-radius:14px; padding:12px 14px; display:flex; align-items:center; justify-content:space-between; gap:10px; border:1px solid #e3eaf2; box-shadow:0 2px 8px rgba(14,27,44,.05); }
  .magaza .ad { font-weight:700; font-size:.92rem; }
  .magaza .saat { font-size:.75rem; color:#6b7f94; margin-top:2px; }
  .btn { border:none; border-radius:999px; padding:11px 18px; font-weight:800; font-size:.84rem; cursor:pointer; transition:.2s; }
  .btn.teslim { background:linear-gradient(135deg,#f77f00,#d96b00); color:#fff; box-shadow:0 4px 12px rgba(247,127,0,.35); }
  .btn.teslim:active { transform:scale(.94); }
  .btn.tamam { background:#e8f5ec; color:var(--yesil); }
  .giris { max-width:340px; margin:80px auto; background:#fff; border-radius:18px; padding:28px 22px; text-align:center; box-shadow:0 12px 30px rgba(14,27,44,.1); }
  .giris h2 { color:var(--mavi); font-size:1.1rem; letter-spacing:1px; }
  .giris p { font-size:.8rem; color:#6b7f94; margin-top:6px; }
  .giris input { width:100%; padding:13px; font-size:1.15rem; letter-spacing:8px; text-align:center; border:2px solid #e3eaf2; border-radius:12px; margin:16px 0 8px; outline:none; }
  .giris input:focus { border-color:var(--turuncu); }
  .giris .btn { width:100%; }
  .hata { color:#d64545; font-size:.8rem; height:20px; }
  .bos { text-align:center; color:#6b7f94; padding:40px 16px; }
  .cikis { position:absolute; right:12px; top:12px; background:none; border:1px solid rgba(255,255,255,.4); color:#fff; border-radius:8px; padding:6px 10px; font-size:.72rem; cursor:pointer; }
  .baglanti { font-size:.7rem; color:#9fb0c3; padding:4px 16px 12px; text-align:center; }
  .karsilama { background:linear-gradient(135deg,#f77f00,#d96b00); color:#fff; padding:14px 16px; font-weight:800; font-size:1.1rem; text-align:center; letter-spacing:.5px; }
  .karsilama span { display:block; font-size:.75rem; font-weight:600; opacity:.9; margin-top:3px; letter-spacing:0; }
  .modal-kap { position:fixed; inset:0; background:rgba(14,27,44,.55); display:none; align-items:center; justify-content:center; z-index:50; padding:14px; }
  .modal { background:#fff; border-radius:18px; padding:20px 16px; width:100%; max-width:380px; box-shadow:0 18px 50px rgba(14,27,44,.35); max-height:92vh; overflow-y:auto; }
  .modal h3 { color:var(--mavi); font-size:1rem; letter-spacing:.5px; margin-bottom:4px; }
  .modal .alt { font-size:.75rem; color:#6b7f94; margin-bottom:12px; }
  .urun-satir { display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 4px; border-bottom:1px solid #eef2f7; }
  .urun-satir .ad { font-size:.88rem; font-weight:700; flex:1; }
  .urun-satir input { width:70px; padding:9px; font-size:1rem; text-align:center; border:2px solid #e3eaf2; border-radius:10px; outline:none; }
  .urun-satir input:focus { border-color:var(--turuncu); }
  .modal .btn { width:100%; margin-top:14px; }
  .modal .vazgec { background:#eef2f7; color:#6b7f94; margin-top:8px; box-shadow:none; }
  .secici-kap { background:#fff; padding:12px 16px; border-bottom:1px solid #e3eaf2; display:grid; gap:8px; }
  .secici-kap select { width:100%; padding:12px; font-size:.92rem; font-weight:700; border:2px solid #e3eaf2; border-radius:10px; outline:none; background:#fbfdff; color:#33465c; -webkit-appearance:none; appearance:none; }
  .secici-kap select:focus { border-color:var(--turuncu); }
  .tip-kap { display:flex; gap:6px; }
  .tip-kap button { flex:1; border:2px solid #e3eaf2; background:#fff; border-radius:999px; padding:9px 4px; font-size:.7rem; font-weight:800; cursor:pointer; color:#6b7f94; }
  .tip-kap button.aktif { border-color:var(--turuncu); background:linear-gradient(135deg,#f77f00,#d96b00); color:#fff; box-shadow:0 3px 10px rgba(247,127,0,.3); }
  .rozet { display:inline-block; font-size:.6rem; font-weight:800; letter-spacing:.5px; padding:2px 8px; border-radius:999px; margin-left:6px; vertical-align:middle; }
  .rozet.sok { background:#e8f5ec; color:#1f8a3d; }
  .rozet.tk { background:#fff4e5; color:#b35c00; }
  .rozet.dig { background:#eef2f7; color:#6b7f94; }
</style>
</head>
<body>

<div class="ust" id="baslik-kap">
  <button class="cikis" id="cikis-btn" style="display:none;">Çıkış</button>
  <h1>NOKTA TEDARİK · ŞOFÖR PANELİ</h1>
  <div class="alt" id="baslik-alt">Gidilecek il: <span class="sehir" id="sehir-ad">İl seçin</span></div>
</div>

<div class="giris" id="giris-kap">
  <h2>ŞOFÖR GİRİŞİ</h2>
  <p>Telefona şifreyi girin</p>
  <input type="password" id="pin" inputmode="numeric" maxlength="6" placeholder="••••••">
  <div class="hata" id="hata"> </div>
  <button class="btn teslim" id="giris-btn">GİRİŞ YAP</button>
</div>

<div style="display:none;" id="panel">
  <div class="karsilama" id="karsilama">MERHABA OSMAN 👋 <span>İyi çalışmalar!</span></div>
  <div class="secici-kap">
    <select id="il-sec"><option value="">İL SEÇİN...</option></select>
    <select id="ilce-sec"><option value="">ÖNCE İL SEÇİN</option></select>
    <div class="tip-kap">
      <button data-tip="TUMU" class="aktif">TÜMÜ</button>
      <button data-tip="S">ŞOK</button>
      <button data-tip="T">TARIM KREDİ</button>
      <button data-tip="D">DİĞER</button>
    </div>
  </div>
  <div class="ozet">
    <div><span>Bölgedeki mağaza</span><br><b id="ozet-sayi">0</b></div>
    <div style="text-align:right;"><span>Bugün teslim edilen</span><br><b id="ozet-tamam">0</b></div>
  </div>
  <div style="padding:10px 16px; background:#fff; border-bottom:1px solid #e3eaf2; display:grid; gap:8px;">
    <div style="display:flex; gap:8px;">
      <button class="btn teslim" id="yukleme-btn" style="padding:11px 10px; font-size:.78rem; flex:1;">📦 DEPO YÜKLEME</button>
      <button class="btn teslim" id="baslama-btn" style="padding:11px 10px; font-size:.78rem; flex:1;">🚚 İŞE BAŞLA</button>
    </div>
    <div style="display:flex; justify-content:space-between; align-items:center; gap:8px;">
      <button class="btn teslim" id="donus-btn" style="text-decoration:none; padding:9px 14px; font-size:.78rem; flex:1;">🔄 DÖNÜŞE GEÇ</button>
      <a class="btn teslim" id="depo-btn" href="tel:+905375966856" style="text-decoration:none; padding:9px 14px; font-size:.78rem;">📞 BÜYÜK PATRONU ARA</a>
    </div>
  </div>
  <div class="liste" id="liste"></div>
  <div style="padding:0 16px 8px;"><button class="btn teslim" id="test-btn" style="width:100%;">TEST BİLDİRİMİ GÖNDER</button></div>
  <div class="baglanti" id="baglanti">Bağlantı kuruluyor...</div>
</div>

<div class="modal-kap" id="urun-modal">
  <div class="modal">
    <h3>📦 ÜRÜN TESLİM GİRİŞİ</h3>
    <div class="alt" id="modal-magaza">Mağaza —</div>
    <div id="urun-listesi"></div>
    <button class="btn teslim" id="kaydet-btn">✓ KAYDET VE TESLİM ET</button>
    <button class="btn vazgec" id="vazgec-btn">Vazgeç</button>
  </div>
</div>

<script>
  var PIN = '177544';
  var FIREBASE_URL = 'https://nokta-tedarik-default-rtdb.firebaseio.com';
  var URUNLER = [
    { ad: 'TARSUS ÇÖREĞİ', sutun: 'D' },
    { ad: 'ÜNYE ÇÖREĞİ', sutun: 'E' },
    { ad: 'KANDİL SİMİTİ', sutun: 'F' },
    { ad: 'KONYA GEVREĞİ', sutun: 'G' },
    { ad: 'SUSAMLI ÇÖREK', sutun: 'H' },
    { ad: 'LAVAŞ', sutun: 'I' },
    { ad: 'GALETA', sutun: 'J' },
    { ad: 'TAM BUĞDAY LAVAŞ', sutun: 'K' }
  ];
</script>
<script src="magazalar.js"></script>
<script>

  function normalize(s) { return s.toUpperCase().replace('İ', 'I'); }

  function tarihYaz(d) {
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
  }

  var girisKap = document.getElementById('giris-kap');
  var panel = document.getElementById('panel');
  var liste = document.getElementById('liste');
  var pinEl = document.getElementById('pin');
  var hata = document.getElementById('hata');
  var sehirEl = document.getElementById('sehir-ad');
  var baglanti = document.getElementById('baglanti');
  var cikisBtn = document.getElementById('cikis-btn');

  var sehir = '';
  var seciliIl = '';
  var seciliIlce = '';
  var seciliTip = 'TUMU';
  sehirEl.textContent = 'İl seçin';

  var ilSecEl = document.getElementById('il-sec');
  var ilceSecEl = document.getElementById('ilce-sec');
  var TIP_AD = { S: 'ŞOK', T: 'TARIM KREDİ', D: 'DİĞER' };

  function ilDoldur() {
    var html = '<option value="">İL SEÇİN...</option>';
    for (var l = 0; l < MAGAZALAR.length; l++) {
      var ad = MAGAZALAR[l].sehir;
      html += '<option value="' + ad + '">' + ad + ' (' + MAGAZALAR[l].magazalar.length + ' mağaza)</option>';
    }
    ilSecEl.innerHTML = html;
  }
  function ilceDoldur() {
    var ilceler = [];
    for (var l = 0; l < MAGAZALAR.length; l++) {
      if (MAGAZALAR[l].sehir !== seciliIl) continue;
      for (var i = 0; i < MAGAZALAR[l].magazalar.length; i++) {
        if (ilceler.indexOf(MAGAZALAR[l].magazalar[i].i) === -1) ilceler.push(MAGAZALAR[l].magazalar[i].i);
      }
    }
    ilceler.sort();
    var html = '<option value="">TÜM İLÇELER</option>';
    for (var j = 0; j < ilceler.length; j++) html += '<option value="' + ilceler[j] + '">' + ilceler[j] + '</option>';
    ilceSecEl.innerHTML = html;
    ilceSecEl.disabled = false;
  }
  ilSecEl.addEventListener('change', function () {
    seciliIl = ilSecEl.value;
    seciliIlce = '';
    sehir = seciliIl;
    sehirEl.textContent = seciliIl || 'İl seçin';
    document.getElementById('baslik-alt').style.display = seciliIl ? '' : 'none';
    ilceDoldur();
    secimKaydet();
    yukle();
    donusYapildi = false;
    donusBtn.textContent = '🔄 DÖNÜŞE GEÇ';
    donusBtn.style.background = '';
  });
  ilceSecEl.addEventListener('change', function () {
    seciliIlce = ilceSecEl.value;
    listeCiz();
    secimKaydet();
  });
  document.querySelector('.tip-kap').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    seciliTip = b.getAttribute('data-tip');
    var btns = this.querySelectorAll('button');
    for (var i = 0; i < btns.length; i++) btns[i].classList.remove('aktif');
    b.classList.add('aktif');
    listeCiz();
  });

  function girisYap() {
    if (pinEl.value.trim() === PIN) {
      localStorage.setItem('sofor-pin', 'ok');
      hata.textContent = '';
      girisKap.style.display = 'none';
      panel.style.display = '';
      cikisBtn.style.display = '';
      baslat();
      bildirimIzinIste();
      konumBaslat();
    } else {
      hata.textContent = 'Yanlış şifre';
      pinEl.value = '';
      pinEl.focus();
    }
  }
  document.getElementById('giris-btn').addEventListener('click', girisYap);
  pinEl.addEventListener('keydown', function (e) { if (e.key === 'Enter') girisYap(); });
  cikisBtn.addEventListener('click', function () {
    localStorage.removeItem('sofor-pin');
    panel.style.display = 'none';
    cikisBtn.style.display = 'none';
    girisKap.style.display = '';
    konumDurdur();
  });

  document.getElementById('test-btn').addEventListener('click', function () {
    if (!('Notification' in window)) { baglanti.textContent = 'Bu tarayıcı bildirim desteklemiyor'; return; }
    if (Notification.permission !== 'granted') {
      Notification.requestPermission().then(function (p) {
        if (p === 'granted') { bildirimGonder('Bildirimler çalışıyor!'); baglanti.textContent = 'Bildirim gönderildi — izin verildi'; }
        else baglanti.textContent = 'İzin verilmedi';
      });
    } else {
      bildirimGonder('Bildirimler çalışıyor!');
      baglanti.textContent = 'Bildirim gönderildi';
    }
  });

  var durumlar = {};
  var gunDurum = {};
  var sonZiyaretler = {};
  var ilKm = { SAMSUN: 150, SİNOP: 220, AMASYA: 90, ÇORUM: 180, SİVAS: 95, TOKAT: 140, YOZGAT: 160, GİRESUN: 230, KAYSERİ: 220 };
  var ortalamaHiz = 85;
  function varisSaati(s) {
    var km = ilKm[s] || 100;
    var saatDegeri = 8 + km / ortalamaHiz;
    var tamsayi = Math.floor(saatDegeri);
    var dakika = Math.round((saatDegeri - tamsayi) * 60);
    if (dakika === 60) { tamsayi++; dakika = 0; }
    return ('0' + tamsayi).slice(-2) + ':' + ('0' + dakika).slice(-2);
  }
  function donusVarisSaati() {
    if (!seciliIl) return null;
    var km = ilKm[seciliIl] || 100;
    var sureSaat = km / ortalamaHiz;
    var simdi = new Date();
    var varis = new Date(simdi.getTime() + sureSaat * 3600 * 1000);
    return {
      varis: varis,
      saat: ('0' + varis.getHours()).slice(-2) + ':' + ('0' + varis.getMinutes()).slice(-2)
    };
  }
  function normalize(s) { return s.toUpperCase().replace('İ', 'I'); }

  var urunModal = document.getElementById('urun-modal');
  var urunListesi = document.getElementById('urun-listesi');
  var modalMagaza = document.getElementById('modal-magaza');
  var beklemeKod = null;

  function magazaBul(kod) {
    for (var l = 0; l < MAGAZALAR.length; l++) {
      for (var m = 0; m < MAGAZALAR[l].magazalar.length; m++) {
        if (MAGAZALAR[l].magazalar[m].k === kod) {
          return { il: MAGAZALAR[l].sehir, magaza: MAGAZALAR[l].magazalar[m], sira: m + 1 };
        }
      }
    }
    return null;
  }

  function teslimModalAc(kod) {
    var bul = magazaBul(kod);
    if (!bul) return;
    var m = bul.magaza;
    var ziyaret = sonZiyaretler[kod];
    modalMagaza.textContent = bul.il + ' · ' + m.m + ' · ' + m.i +
      (ziyaret ? ' · Son uğrama: ' + ziyaret.tarih : ' · İlk ziyaret');
    beklemeKod = kod;
    var html = '';
    for (var u = 0; u < URUNLER.length; u++) {
      html += '<div class="urun-satir"><span class="ad">' + URUNLER[u].ad + '</span>' +
        '<input type="number" inputmode="numeric" min="0" placeholder="0" data-sutun="' + URUNLER[u].sutun + '"></div>';
    }
    urunListesi.innerHTML = html;
    urunModal.style.display = 'flex';
    var ilkInput = urunListesi.querySelector('input');
    if (ilkInput) ilkInput.focus();
  }

  function urunKaydet() {
    if (beklemeKod === null) return;
    var bul = magazaBul(beklemeKod);
    if (!bul) return;
    var girisler = {};
    var inputs = urunListesi.querySelectorAll('input');
    for (var i = 0; i < inputs.length; i++) {
      var deger = parseInt(inputs[i].value, 10);
      if (isNaN(deger)) deger = 0;
      girisler[inputs[i].getAttribute('data-sutun')] = deger;
    }
    var saat = new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
    var bugun = tarihYaz(new Date());
    var magazaAd = bul.magaza.m;
    var adres = FIREBASE_URL + '/gunluk/' + bugun + '/' + bul.il + '/' + bul.sira + '.json';
    fetch(adres, {
      method: 'PUT',
      body: JSON.stringify({ saat: saat, urunler: girisler, magaza: magazaAd, k: beklemeKod })
    }).then(function () {
      durumlar[beklemeKod] = { saat: saat, urunler: girisler, magaza: magazaAd, k: beklemeKod };
      var ziyaretAdres = FIREBASE_URL + '/sonziyaret/' + beklemeKod + '.json';
      return fetch(ziyaretAdres, { method: 'PUT', body: JSON.stringify({ tarih: bugun, saat: saat }) });
    }).then(function () {
      sonZiyaretler[beklemeKod] = { tarih: bugun, saat: saat };
      urunModal.style.display = 'none';
      beklemeKod = null;
      listeCiz();
    }).catch(function () {
      baglanti.textContent = 'Bağlantı hatası — kaydedilemedi';
    });
  }

  document.getElementById('kaydet-btn').addEventListener('click', urunKaydet);
  document.getElementById('vazgec-btn').addEventListener('click', function () {
    urunModal.style.display = 'none';
    beklemeKod = null;
  });
  urunModal.addEventListener('click', function (e) {
    if (e.target === urunModal) { urunModal.style.display = 'none'; beklemeKod = null; }
  });

  function tarihKisa(t) {
    if (!t) return '';
    var p = t.split('-');
    if (p.length !== 3) return t;
    return p[2] + '.' + p[1] + '.' + p[0];
  }

  function filtreliMagazalar() {
    var sonuc = [];
    for (var l = 0; l < MAGAZALAR.length; l++) {
      var il = MAGAZALAR[l];
      if (seciliIl && il.sehir !== seciliIl) continue;
      for (var i = 0; i < il.magazalar.length; i++) {
        var m = il.magazalar[i];
        if (seciliIlce && m.i !== seciliIlce) continue;
        if (seciliTip !== 'TUMU' && (m.t || 'S') !== seciliTip) continue;
        sonuc.push({ ilAd: il.sehir, magaza: m, sira: i + 1 });
      }
    }
    return sonuc;
  }

  function listeCiz() {
    var html = '';
    var toplam = 0;
    var bugunYapilan = 0;
    var list = filtreliMagazalar();
    toplam = list.length;
    var ilGruplar = {};
    for (var g = 0; g < list.length; g++) {
      if (!ilGruplar[list[g].ilAd]) ilGruplar[list[g].ilAd] = [];
      ilGruplar[list[g].ilAd].push(list[g]);
    }
    var ilAdlari = Object.keys(ilGruplar);
    for (var li = 0; li < ilAdlari.length; li++) {
      var ilAd = ilAdlari[li];
      var grup = ilGruplar[ilAd];
      html += '<div class="il-baslik">' + ilAd + '<span>' + grup.length + ' mağaza</span></div>';
      for (var i = 0; i < grup.length; i++) {
        var m = grup[i].magaza;
        var d = durumlar[m.k] || null;
        var ziyaret = sonZiyaretler[m.k] || null;
        if (d) bugunYapilan++;
        var alt = (ziyaret ? 'Son uğrama: ' + tarihKisa(ziyaret.tarih) + ' · ' : 'İlk ziyaret · ') + m.i;
        var tip = m.t || 'S';
        var rozet = '<span class="rozet ' + (tip === 'T' ? 'tk' : tip === 'D' ? 'dig' : 'sok') + '">' + TIP_AD[tip] + '</span>';
        html += '<div class="magaza">' +
          '<div><div class="ad">' + m.m + rozet + '</div>' +
          '<div class="saat">' + (d ? (d.red ? '✗ ' + d.red : 'Teslim: ' + d.saat) + ' · ' + alt : alt) + '</div></div>' +
          (d
            ? (d.red
              ? '<button class="btn geri-al" data-geri="' + m.k + '" style="background:#fdecea;color:#c0392b;">✗ ' + d.red + '</button>'
              : '<button class="btn tamam" data-geri="' + m.k + '">✓ Teslim Edildi</button>')
            : '<div style="display:flex;gap:6px;">' +
              '<button class="btn teslim" data-no="' + m.k + '">✓</button>' +
              '<button class="btn red" data-red="' + m.k + '" style="background:#fdecea;color:#c0392b;padding:11px 10px;">✗</button>' +
              '</div>') +
          '</div>';
      }
    }
    if (!list.length) html = '<div class="bos">Seçim için mağaza bulunamadı</div>';
    liste.innerHTML = html;
    document.getElementById('ozet-sayi').textContent = toplam;
    document.getElementById('ozet-tamam').textContent = bugunYapilan;
  }

  function secimKaydet() {
    var adres = FIREBASE_URL + '/secim/' + tarihYaz(new Date()) + '.json';
    fetch(adres, {
      method: 'PUT',
      body: JSON.stringify({ il: seciliIl, ilce: seciliIlce, tip: seciliTip })
    }).catch(function () {});
  }

  function silKayit(kod, sonraCiz) {
    var bul = magazaBul(kod);
    if (!bul) return;
    var adres = FIREBASE_URL + '/gunluk/' + tarihYaz(new Date()) + '/' + bul.il + '/' + bul.sira + '.json';
    fetch(adres, { method: 'DELETE' }).then(function () {
      delete durumlar[kod];
      if (sonraCiz) sonraCiz();
    }).catch(function () {
      baglanti.textContent = 'Bağlantı hatası';
    });
  }

  liste.addEventListener('click', function (e) {
    var btn = e.target.closest('.btn.teslim');
    if (btn) {
      teslimModalAc(btn.getAttribute('data-no'));
      return;
    }
    var geriBtn = e.target.closest('.btn.tamam');
    if (geriBtn && confirm('Bu mağazanın teslim işaretini geri al? Sayı düşer.')) {
      silKayit(geriBtn.getAttribute('data-geri'), listeCiz);
    }
    var redBtn = e.target.closest('.btn.red');
    if (redBtn) {
      var kod3 = redBtn.getAttribute('data-red');
      var bul3 = magazaBul(kod3);
      if (!bul3) return;
      var neden = prompt('Teslim edilemedi — nedeni yaz (örn: Kapalı, Adres yok, Ürün reddedildi):', 'Kapalı');
      if (neden === null || !neden.trim()) return;
      var adres3 = FIREBASE_URL + '/gunluk/' + tarihYaz(new Date()) + '/' + bul3.il + '/' + bul3.sira + '.json';
      fetch(adres3, {
        method: 'PUT',
        body: JSON.stringify({ saat: new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' }), red: neden.trim(), k: kod3 })
      }).then(function () {
        durumlar[kod3] = { red: neden.trim(), k: kod3 };
        listeCiz();
      }).catch(function () {
        baglanti.textContent = 'Bağlantı hatası';
      });
    }
    var geriRed = e.target.closest('.btn.geri-al');
    if (geriRed && confirm('Bu mağazanın "teslim edilemedi" işaretini geri al?')) {
      silKayit(geriRed.getAttribute('data-geri'), listeCiz);
    }
  });

  var yuklemeBtn = document.getElementById('yukleme-btn');
  var baslamaBtn = document.getElementById('baslama-btn');
  function durumOku() {
    fetch(FIREBASE_URL + '/durum/' + tarihYaz(new Date()) + '.json')
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d && (d.yukleme || d.baslama)) gunDurum = d;
        else gunDurum = {};
        durumButonYansit();
      }).catch(function () { gunDurum = {}; });
  }
  function durumButonYansit() {
    if (gunDurum.yukleme) {
      yuklemeBtn.textContent = '✓ YÜKLEME ' + gunDurum.yukleme;
      yuklemeBtn.classList.add('tamam');
    } else {
      yuklemeBtn.textContent = '📦 DEPO YÜKLEME';
      yuklemeBtn.classList.remove('tamam');
    }
    if (gunDurum.baslama) {
      baslamaBtn.textContent = '✓ İŞ BAŞI ' + gunDurum.baslama;
      baslamaBtn.classList.add('tamam');
    } else {
      baslamaBtn.textContent = '🚚 İŞE BAŞLA';
      baslamaBtn.classList.remove('tamam');
    }
  }
  function durumDamga(yuklemeMi) {
    var saat = new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });
    var adres = FIREBASE_URL + '/durum/' + tarihYaz(new Date()) + '.json';
    var veri = {};
    if (yuklemeMi) {
      gunDurum.yukleme = saat;
      veri.yukleme = saat;
      if (!gunDurum.baslama) { gunDurum.asama = 'yukleme'; veri.asama = 'yukleme'; }
    } else {
      gunDurum.baslama = saat;
      veri.baslama = saat;
      veri.asama = 'baslama';
      gunDurum.asama = 'baslama';
    }
    fetch(adres, { method: 'PATCH', body: JSON.stringify(veri) })
      .then(function () { durumButonYansit(); baglanti.textContent = 'Gün durumu kaydedildi — ' + saat; })
      .catch(function () { baglanti.textContent = 'Bağlantı hatası — kaydedilemedi'; });
    durumButonYansit();
  }

  var donusBtn = document.getElementById('donus-btn');
  var donusYapildi = false;
  donusBtn.addEventListener('click', function () {
    if (!seciliIl) {
      baglanti.textContent = 'Önce il seçin';
      return;
    }
    var hesap = donusVarisSaati();
    if (!hesap) return;
    donusYapildi = true;
    donusBtn.textContent = '🔄 Dönüşte — Tahmini varış: ' + hesap.saat;
    donusBtn.style.background = 'var(--turuncu-koyu, #f39c12)';
    baglanti.textContent = 'Dönüş başladı — depoya tahmini varış ' + hesap.saat;
    fetch(FIREBASE_URL + '/donus/' + tarihYaz(new Date()) + '.json', {
      method: 'PUT',
      body: JSON.stringify({ il: seciliIl, ilce: seciliIlce, baslangic: new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' }), varisTahmini: hesap.saat, ts: Date.now() })
    }).catch(function () {});
    fetch(FIREBASE_URL + '/durum/' + tarihYaz(new Date()) + '.json', {
      method: 'PATCH',
      body: JSON.stringify({ asama: 'donus' })
    }).catch(function () {});
  });

  function yukle() {
    var gunlukAdres = FIREBASE_URL + '/gunluk/' + tarihYaz(new Date()) + (seciliIl ? '/' + seciliIl : '') + '.json';
    fetch(gunlukAdres).then(function (r) { return r.json(); }).then(function (d) {
      durumlar = {};
      if (d) {
        if (seciliIl) {
          for (var anahtar2 in d) {
            var kayit2 = d[anahtar2];
            if (kayit2 && (kayit2.saat || kayit2.red)) {
              if (kayit2.k) durumlar[kayit2.k] = kayit2;
              else {
                var bul2 = magazaBul(anahtar2);
                if (bul2) durumlar[bul2.magaza.k] = kayit2;
              }
            }
          }
        } else {
          for (var sehirAd in d) {
            var sehVeri = d[sehirAd];
            for (var anahtar in sehVeri) {
              var kayit = sehVeri[anahtar];
              if (kayit && (kayit.saat || kayit.red)) {
                if (kayit.k) durumlar[kayit.k] = kayit;
                else {
                  var bul = magazaBul(anahtar);
                  if (bul) durumlar[bul.magaza.k] = kayit;
                }
              }
            }
          }
        }
      }
      listeCiz();
      baglanti.textContent = 'Çevrimiçi — canlı senkronize';
    }).catch(function () {
      baglanti.textContent = 'Firebase adresi kurulmadı — yöneticiye bildirin';
    });
    fetch(FIREBASE_URL + '/sonziyaret.json').then(function (r) { return r.json(); }).then(function (d) {
      if (d) sonZiyaretler = d;
      listeCiz();
    }).catch(function () { });
    durumOku();
  }

  function baslat() {
    ilDoldur();
    yukle();
    setInterval(yukle, 2000);
  }

  var bildirimIsmi = 'NOKTA TEDARİK';
  function bildirimIzinIste() {
    if (!('Notification' in window)) return;
    if (Notification.permission === 'granted') return;
    Notification.requestPermission().then(function (p) {
      if (p === 'granted') baglanti.textContent = 'Çevrimiçi — bildirimler açık';
    });
  }
  function bildirimGonder(metin) {
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    try {
      navigator.serviceWorker.ready.then(function (reg) {
        reg.showNotification(bildirimIsmi, { body: metin, icon: 'NoktaTedarik-Logo.jpg', badge: 'NoktaTedarik-Logo.jpg', tag: 'hatirlatma' });
      });
    } catch (e) { }
  }

  function hatirlatmaKontrol() {
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    var simdi = new Date();
    var gun = tarihYaz(simdi);
    var saat = simdi.getHours();
    var dakika = simdi.getMinutes();
    if (dakika < 1 || dakika > 3) return;
    if (localStorage.getItem('hatir-saat') === gun + '-' + saat) return;
    var teslimSayi = 0;
    for (var k in durumlar) teslimSayi++;
    if (saat >= 11) {
      if (teslimSayi < 400) {
        bildirimGonder((400 - teslimSayi) + ' mağaza henüz işaretlenmedi! Bugünkü teslimatı kontrol et.');
        localStorage.setItem('hatir-saat', gun + '-' + saat);
      }
    }
  }

  var konumAktif = false;
  var konumTimer = null;
  var sonKonum = null;
  function konumBaslat() {
    if (konumAktif) return;
    if (!('geolocation' in navigator)) {
      baglanti.textContent = 'Bu cihaz konum desteklemiyor';
      return;
    }
    konumAktif = true;
    konumGonder();
    konumTimer = setInterval(konumGonder, 15000);
  }
  function konumDurdur() {
    konumAktif = false;
    if (konumTimer) { clearInterval(konumTimer); konumTimer = null; }
  }
  function konumGonder() {
    if (!konumAktif) return;
    navigator.geolocation.getCurrentPosition(function (pos) {
      sonKonum = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      var veri = {
        lat: sonKonum.lat,
        lng: sonKonum.lng,
        saat: new Date().toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' }),
        sehir: sehir || ''
      };
      fetch(FIREBASE_URL + '/konum/guncel.json', { method: 'PUT', body: JSON.stringify(veri) }).catch(function () { });
      fetch(FIREBASE_URL + '/konum/gecmis/' + tarihYaz(new Date()) + '/' + Date.now() + '.json', {
        method: 'PUT',
        body: JSON.stringify({ lat: sonKonum.lat, lng: sonKonum.lng })
      }).catch(function () { });
    }, function () {
      baglanti.textContent = 'Konum izni yok — takip kapalı. Ayarlardan konumu açın';
    }, { enableHighAccuracy: true, timeout: 8000, maximumAge: 5000 });
  }

  function pwaKur() {
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(function () { });
    }
    setInterval(hatirlatmaKontrol, 60000);
  }
  pwaKur();

  if (localStorage.getItem('sofor-pin') === 'ok') {
    girisKap.style.display = 'none';
    panel.style.display = '';
    cikisBtn.style.display = '';
    baslat();
    konumBaslat();
  }
</script>
</body>
</html>
